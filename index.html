<!DOCTYPE html>
<html lang="zh-CN">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

      color: #1e2a3a;
      padding-bottom: 40px;
      min-height: 100vh;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #e8ecf1; }
    ::-webkit-scrollbar-thumb { background: #c8102e; border-radius: 4px; }

    /* Header */
    .header {
      background: linear-gradient(135deg, #c8102e 0%, #a00d26 100%);
      padding: 24px 20px 16px;
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(200, 16, 46, 0.35);
    }
    .header h1 { font-size: 22px; font-weight: 700; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
    .header h1 span { font-size: 26px; }
    .header .sub { font-size: 13px; opacity: 0.85; margin-top: 4px; }

    /* Key 输入面板 */
    .panel {
      background: #fff;
      border-radius: 16px;
      padding: 16px 18px;
      margin: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    }
    .panel h3 { font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .row { display: flex; gap: 8px; margin-bottom: 8px; }
    .row input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #dde3ea;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .row input:focus { border-color: #c8102e; }
    .btn {
      width: 100%;
      padding: 12px;
      background: #c8102e;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #a00d26; }
    .btn.secondary { background: #5a6a7a; margin-top: 6px; }
    .btn.secondary:hover { background: #3a4a5a; }
    .hint { font-size: 12px; color: #8a9aaa; margin-top: 8px; line-height: 1.5; }
    .hint a { color: #c8102e; }
    .key-status { font-size: 13px; margin-top: 8px; }
    .key-status.ok { color: #2e7d32; }
    .key-status.warn { color: #e65100; }

    /* 地图与结果 */
    #map { width: 100%; height: 380px; border-radius: 16px; margin: 0 16px 16px; overflow: hidden; display: none; width: calc(100% - 32px); }
    #result { margin: 0 16px 16px; background: #fff; border-radius: 16px; padding: 12px; font-size: 14px; line-height: 1.6; display: none; }

    /* 路线查询 */
    #routePanel { display: none; }

    /* 分类标签 */
    .tabs {
      display: flex;
      gap: 8px;
      padding: 0 16px 12px;
      overflow-x: auto;
      scrollbar-width: none;
      flex-wrap: nowrap;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs .tab {
      flex-shrink: 0;
      padding: 7px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      background: #e8ecf1;
      color: #5a6a7a;
      border: none;
      cursor: pointer;
      transition: all 0.25s;
      white-space: nowrap;
    }
    .tabs .tab:hover { background: #d5dbe3; }
    .tabs .tab.active { background: #c8102e; color: #fff; box-shadow: 0 4px 12px rgba(200,16,46,0.30); }

    /* 卡片列表 */
    .section-title {
      padding: 8px 16px 6px;
      font-size: 17px;
      font-weight: 700;
      color: #1e2a3a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .list { padding: 0 16px 12px; display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      transition: all 0.3s ease;
      border: 1px solid transparent;
    }
    .card:hover { box-shadow: 0 6px 24px rgba(0,0,0,0.08); transform: translateY(-2px); border-color: rgba(200,16,46,0.10); }
    .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .card-name { font-size: 17px; font-weight: 700; color: #1e2a3a; line-height: 1.3; }
    .card-tag {
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 12px;
      border-radius: 12px;
      background: #eef2f7;
      color: #5a6a7a;
      margin-top: 2px;
    }
    .card-tag.景点 { background: #e8f5e9; color: #2e7d32; }
    .card-tag.商场 { background: #fff3e0; color: #e65100; }
    .card-tag.夜市 { background: #fce4ec; color: #c62828; }
    .card-tag.咖啡 { background: #e3f2fd; color: #0d47a1; }
    .card-tag.紧急 { background: #ffebee; color: #b71c1c; }
    .card-meta { font-size: 13px; color: #5a6a7a; margin-top: 6px; line-height: 1.6; }
    .card-meta .label { font-weight: 600; color: #3a4a5a; }
    .card-desc { font-size: 13px; color: #6a7a8a; margin-top: 6px; line-height: 1.6; }
    .card-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .card-actions button {
      flex: 1;
      min-width: 120px;
      padding: 8px 12px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-nav { background: #c8102e; color: #fff; }
    .btn-nav:hover { background: #a00d26; }
    .btn-copy { background: #eef2f7; color: #3a4a5a; }
    .btn-copy:hover { background: #dde3ea; }

    .footer {
      text-align: center;
      padding: 20px 16px 8px;
      font-size: 12px;
      color: #aab5c5;
      border-top: 1px solid #e8ecf1;
      margin: 8px 16px 0;
    }

    @media (min-width: 640px) {
      .list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 0 40px 12px; }
      .tabs { padding: 0 40px 14px; }
      .section-title { padding: 8px 40px 6px; }
      .panel { margin: 16px 40px; }
      #map { margin: 0 40px 16px; width: calc(100% - 80px); }
      #result { margin: 0 40px 16px; }
      .footer { margin: 8px 40px 0; }
    }
    @media (min-width: 1024px) {
      .list { grid-template-columns: repeat(3, 1fr); padding: 0 60px 12px; }
      .tabs { padding: 0 60px 14px; }
      .section-title { padding: 8px 60px 6px; }
      .panel { margin: 16px 60px; }
      #map { margin: 0 60px 16px; width: calc(100% - 120px); }
      #result { margin: 0 60px 16px; }
      .footer { margin: 8px 60px 0; }
    }
  </style>
</head>

    // ============================================================
    //  状态
    // ============================================================
    let currentCat = 'all';
    let amapLoaded = false;

    // ============================================================
    //  渲染卡片
    // ============================================================
    function renderCards() {
      const list = document.getElementById('list');
      let items = DATA;
      if (currentCat !== 'all') {
        items = items.filter(d => d.cat === currentCat);
      }

      if (items.length === 0) {
        list.innerHTML = '<div style="text-align:center;padding:40px;color:#8a9aaa;">暂无内容</div>';
        return;
      }

      let html = '';
      items.forEach(item => {
        const navBtn = item.nav
          ? `<button class="btn-nav" onclick="navigateTo('${item.nav.replace(/'/g, "\\'")}')">🧭 导航至此</button>`
          : '';
        html += `
          <div class="card">
            <div class="card-header">
              <div class="card-name">${item.name}</div>
              <span class="card-tag ${item.cat}">${item.cat}</span>
            </div>
            <div class="card-meta">${item.meta}</div>
            <div class="card-desc">${item.desc}</div>
            <div class="card-actions">
              ${navBtn}
              <button class="btn-copy" onclick="copyText('${item.name.replace(/'/g, "\\'")}')">📋 复制名称</button>
            </div>
          </div>
        `;
      });
      list.innerHTML = html;
    }

    // ============================================================
    //  分类切换
    // ============================================================
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        currentCat = this.dataset.cat;
        renderCards();
      });
    });

    // ============================================================
    //  复制名称
    // ============================================================
    function copyText(text) {
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        alert('已复制：' + text);
      }).catch(() => {
        // fallback
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        alert('已复制：' + text);
      });
    }

    //  高德地图 Key 加载
    // ============================================================

    function getSavedSecurity() { return localStorage.getItem('amap_security') || ''; }

      } else {
        document.getElementById('keyStatus').textContent = '请填写 Key 后点击保存并加载';
        document.getElementById('keyStatus').className = 'key-status warn';
      }
      renderCards();
    });

    function saveAndLoad() {
      const key = document.getElementById('inputKey').value.trim();
      const security = document.getElementById('inputSecurity').value.trim();
      if (!key) { alert('请填写高德 Key'); return; }
      localStorage.setItem('amap_key', key);
      localStorage.setItem('amap_security', security);
      loadAMap(key, security);
    }

    function resetKey() {
      localStorage.removeItem('amap_key');
      localStorage.removeItem('amap_security');
      location.reload();
    }

    function loadAMap(key, security) {
      if (amapLoaded) return;

      if (security) {
        window._AMapSecurityConfig = { securityJsCode: security };
      }

      document.getElementById('keyStatus').textContent = '正在加载高德地图…';
      document.getElementById('keyStatus').className = 'key-status';

      const script = document.createElement('script');
      script.src = `https://webapi.amap.com/maps?v=2.0&key=${encodeURIComponent(key)}&plugin=AMap.Transfer`;
      script.onload = function() {
        amapLoaded = true;
        document.getElementById('keyStatus').textContent = '✅ 地图加载成功';
        document.getElementById('keyStatus').className = 'key-status ok';

        document.getElementById('keyPanel').style.display = 'none';
        document.getElementById('routePanel').style.display = 'block';
        document.getElementById('map').style.display = 'block';
        document.getElementById('result').style.display = 'block';

        initMap();
      };
      script.onerror = function() {
        document.getElementById('keyStatus').textContent = '❌ 加载失败，请检查 Key 或网络';
        document.getElementById('keyStatus').className = 'key-status warn';
      };
      document.head.appendChild(script);
    }

    // ============================================================
    //  地图初始化
    // ============================================================
    let map, transfer;

    function initMap() {
      map = new AMap.Map('map', {
        zoom: 12,
        center: [106.550464, 29.563761]
      });
      transfer = new AMap.Transfer({
        map: map,
        city: '重庆',
        policy: AMap.TransferPolicy.LEAST_TIME,
        panel: 'result'
      });
    }

    // ============================================================
    //  路线查询
    // ============================================================
    function planRoute() {
      if (!transfer) { alert('地图尚未加载完成'); return; }
      const start = document.getElementById('start').value.trim();
      const end = document.getElementById('end').value.trim();
      if (!start || !end) { alert('请填写起点和终点'); return; }
      document.getElementById('result').innerHTML = '规划中…';
      transfer.search([
        { keyword: start, city: '重庆' },
        { keyword: end, city: '重庆' }
      ], function(status, result) {
        if (status !== 'complete') {
          document.getElementById('result').innerHTML = '路线规划失败，请检查地点名称。';
          console.error(result);
        }
      });
    }

    // ============================================================
    //  导航至此（起点默认公寓）
    // ============================================================
    function navigateTo(destination) {
      const from = prompt('请输入起点：', '重庆万豪行政公寓');
      if (!from) return;
      document.getElementById('start').value = from;
      document.getElementById('end').value = destination;
      planRoute();
      document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  </script>

</body>
</html>
